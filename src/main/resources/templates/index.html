<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperatura</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<main>
    <h1>Conversor de Temperatura</h1>

    <form action="/converter" method="post">
        <label for="temp-input">Digite a temperatura</label>
        <input type="number" id="temp-input"
               name="temperatura" step="any" required>

        <label for="escala-select">Escolha a escala</label>
        <select id="escala-select" name="escala" required>
            <option value="celsius">Celsius (°C)</option>
            <option value="fahrenheit">Fahrenheit (°F)</option>
            <option value="kelvin/celsius">Celsius → Kelvin (K)</option>
            <option value="kelvin/fahrenheit">Celsius → Fahrenheit</option>
        </select>

        <button type="submit">Converter</button>
    </form>

    <p th:if="${resultado != null}">
        Resultado: <span th:text="${resultado}"></span>
    </p>
</main>
</body>
</html>
