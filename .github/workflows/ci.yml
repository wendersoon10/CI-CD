name: conversor de temperatura

on:
  pull_request:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Executar comando com Java
      run: ./mvnw test
